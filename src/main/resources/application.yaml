spring:
  config:
    import: optional:file:./application-secret.yaml

  application:
    name: stockTrade

  devtools:
    restart:
      enabled: false
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
      static-locations: file:src/main/resources/static/
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/

  task:
    scheduling:
      enabled: true

  freemarker:
    cache: false

  security:
    user:
      name:
      password:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:h2:file:~/stockTrade
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

hantu-openapi:
  appkey: ${HANTU_APP_KEY}
  appsecret: ${HANTU_APP_SECRET}
  appUrl: https://openapivts.koreainvestment.com:29443
  #appUrl: https://openapi.koreainvestment.com:9443 #실전 도메인
  wsUrl: ws://ops.koreainvestment.com:31000
  #wsUrl: ws://ops.koreainvestment.com:21000 #실전 도메인
logging:
  level:
    org.hibernate.SQL: debug

kis:
  rank:
    refresh-interval-ms: 30000 # 30초마다 갱신

naver-openapi:
  clientId: ${NAVER_CLIENT_ID}
  clientSecret: ${NAVER_CLIENT_SECRET}

