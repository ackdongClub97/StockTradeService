<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 · 모의투자 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/join.css"/>
</head>
<body>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-mark">ST</div>
    <div class="logo-title">모의투자 시스템</div>
    <div class="logo-sub">한국투자증권 Open API 활용</div>
  </div>

  <div class="card">
    <div class="card-title">회원가입</div>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <!-- 씨드 머니 안내 -->
    <div class="seed-info">
      가입 시 초기 투자금 <span>10,000,000원</span>이 지급됩니다.
    </div>

    <a th:href="@{/oauth2/authorization/kakao}" class="kakao-btn">카카오로 3초만에 시작하기</a>
    <div class="divider">또는 직접 입력</div>

    <div class="input-group">
      <label for="memberId">아이디</label>
      <input name="memberId" type="text" id="memberId" placeholder="영문, 숫자 4~20자"/>
      <div class="field-msg" id="memberIddMsg"></div>
    </div>

    <div class="input-group">
      <label for="password">비밀번호</label>
      <input name="password" type="password" id="password" placeholder="8자 이상 입력"/>
      <div class="field-msg" id="passwordMsg"></div>
    </div>

    <div class="input-group">
      <label for="passwordConfirm">비밀번호 확인</label>
      <input name="passwordConfirm" type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력"/>
      <div class="field-msg" id="passwordConfirmMsg"></div>
    </div>

    <div class="input-group">
      <label for="name">이름</label>
      <input name="name" type="text" id="name" placeholder="실명을 입력하세요"/>
    </div>

    <div class="input-group">
      <label for="email">이메일</label>
      <input name="email" type="email" id="email" placeholder="example@email.com"/>
    </div>

    <div class="input-group">
      <label for="phone">전화번호</label>
      <input name="phone" type="tel" id="phone" placeholder="010-0000-0000"/>
    </div>

    <button type="button" class="submit-btn" id="submitBtn" onclick="submitJoin()">
      회원가입
    </button>
  </div>

  <div class="bottom-link">
    이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
  </div>
</div>

<script th:inline="none">
  // 유효성 검사
  document.getElementById('memberId').addEventListener('blur', function() {
    const val = this.value;
    const msg = document.getElementById('memberIdMsg');
    if (val.length < 4 || val.length > 20) {
      this.className = 'invalid';
      msg.className = 'field-msg error';
      msg.textContent = '아이디는 4~20자여야 합니다.';
    } else {
      this.className = 'valid';
      msg.className = 'field-msg success';
      msg.textContent = '사용 가능한 아이디입니다.';
    }
  });

  document.getElementById('password').addEventListener('blur', function() {
    const val = this.value;
    const msg = document.getElementById('passwordMsg');
    if (val.length < 8) {
      this.className = 'invalid';
      msg.className = 'field-msg error';
      msg.textContent = '비밀번호는 8자 이상이어야 합니다.';
    } else {
      this.className = 'valid';
      msg.className = 'field-msg success';
      msg.textContent = '사용 가능한 비밀번호입니다.';
    }
  });

  document.getElementById('passwordConfirm').addEventListener('blur', function() {
    const pw = document.getElementById('password').value;
    const msg = document.getElementById('passwordConfirmMsg');
    if (this.value !== pw) {
      this.className = 'invalid';
      msg.className = 'field-msg error';
      msg.textContent = '비밀번호가 일치하지 않습니다.';
    } else {
      this.className = 'valid';
      msg.className = 'field-msg success';
      msg.textContent = '비밀번호가 일치합니다.';
    }
  });

  function submitJoin() {
    const memberId   = document.getElementById('memberId').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const phone    = document.getElementById('phone').value.trim();

    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    // 유효성 검사
    if (!memberId || !password || !name || !email) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = '필수 항목을 모두 입력해주세요.';
      successMsg.style.display = 'none';
      return;
    }
    if (password !== passwordConfirm) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = '비밀번호가 일치하지 않습니다.';
      successMsg.style.display = 'none';
      return;
    }

    document.getElementById('submitBtn').disabled = true;
     console.log("submitJoin 실행됨");
    fetch('/api/member/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberId, password, name, email, phone })
    })
    .then(r => r.json())
    .then(data => {
      if (data.message === 'SUCCESS') {
        successMsg.style.display = 'block';
        successMsg.textContent = '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.';
        errorMsg.style.display = 'none';
        setTimeout(() => window.location.href = '/login', 1500);
      } else {
        errorMsg.style.display = 'block';
        errorMsg.textContent = data.message;
        successMsg.style.display = 'none';
        document.getElementById('submitBtn').disabled = false;
      }
    })
    .catch(() => {
      errorMsg.style.display = 'block';
      errorMsg.textContent = '서버 오류가 발생했습니다.';
      document.getElementById('submitBtn').disabled = false;
    });
  }
</script>
</body>
</html>
