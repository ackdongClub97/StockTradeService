<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 · 모의투자 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/login.css"/>
</head>
<body>

<div class="container">
  <div class="logo-wrap">
    <div class="logo-mark">ST</div>
    <div class="logo-title">모의투자 시스템</div>
    <div class="logo-sub">한국투자증권 Open API 활용</div>
  </div>

  <div class="card">
    <div class="card-title">로그인</div>

    <!-- 로그인 실패 메시지 -->
    <div class="error-msg" th:if="${param.error}">
      아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="input-group">
        <label>아이디</label>
        <input type="text" name="username" placeholder="아이디를 입력하세요" required/>
      </div>
      <div class="input-group">
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호를 입력하세요" required/>
      </div>
      <button type="submit" class="submit-btn">로그인</button>
    </form>
  </div>

  <div class="bottom-link">
    계정이 없으신가요? <a th:href="@{/join}">회원가입</a>
  </div>
</div>

</body>
</html>
