<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>거래량 실시간 랭킹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/stockHome.css"/>
</head>
<body>

<!-- 실시간 랭킹 데이터가 도착하기 전까지 표시 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner" id="loadingSpinner"></div>
  <div class="loading-text" id="loadingText">실시간 랭킹을 불러오는 중...</div>
  <button type="button" class="retry-btn" id="loadingRetryBtn" style="display:none;">다시 시도</button>
</div>

<div class="page">

  <!-- 헤더 -->
  <div class="page-inner">  <!-- ← 추가 -->
    <header class="header">
      <div th:replace="~{fragments/header :: header}"></div>
    </header>
  </div>



  <!-- 테이블: thead 고정 + tbody 스크롤 -->
  <div class="stock-ranking-list">
    <div class="table-wrap">
      <!-- 고정 헤더 -->
      <div class="table-scroll-head">

        <div class="rank-header-bar">
          <span>거래량 순위</span>
          <div class="status-panel">
            <div class="status-chip">
              <span class="dot" id="statusDot"></span>
              <span id="statusText">연결 중...</span>
            </div>
            <div class="status-chip" id="lastUpdateChip" style="display:none">
              <span id="lastUpdateText">—</span>
            </div>
          </div>
        </div>

        <table>
          <colgroup>
            <col class="c-rank"/><col class="c-name"/><col class="c-price"/>
            <col class="c-rate"/><col class="c-vol"/><col class="c-pvol"/>
          </colgroup>
          <thead>
          <tr>
            <th>순위</th>
            <th>종목</th>
            <th class="right">현재가</th>
            <th class="right">등락률</th>
            <th class="right">누적 거래량</th>
            <th class="right col-pvol">전일 거래량</th>
          </tr>
          </thead>
        </table>
      </div>

      <!-- 스크롤 바디 -->
      <div class="table-scroll-body">
        <table>
          <colgroup>
            <col class="c-rank"/><col class="c-name"/><col class="c-price"/>
            <col class="c-rate"/><col class="c-vol"/><col class="c-pvol"/>
          </colgroup>
          <tbody id="rankBody">
          <tr th:each="i : ${#numbers.sequence(1,20)}" class="skeleton-row">
            <td><div class="skeleton" style="width:24px"></div></td>
            <td>
              <div class="skeleton" style="width:90px;margin-bottom:4px"></div>
              <div class="skeleton" style="width:50px;height:9px"></div>
            </td>
            <td class="right"><div class="skeleton" style="width:70px;margin-left:auto"></div></td>
            <td class="right"><div class="skeleton" style="width:50px;margin-left:auto"></div></td>
            <td class="right"><div class="skeleton" style="width:80px;margin-left:auto"></div></td>
            <td class="right col-pvol"><div class="skeleton" style="width:65px;margin-left:auto"></div></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="middle-box">
    <div class="seed-info"  sec:authorize="isAnonymous()" >
      가입 시 초기 투자금&nbsp;&nbsp;<span>10,000,000원</span>이 지급됩니다.
    </div>
    <div class="seed-info"  sec:authorize="isAuthenticated()" >
      총 투자금:&nbsp;<span sec:authorize="isAuthenticated()" id="seed"></span>원
    </div>
  </div>
  <div class="bottom-box">
    <div class="tab-container">
      <div class="tab-menu">
        <button class="tab-btn active" data-tab="holding">보유주식</button>
        <button class="tab-btn" data-tab="history">거래내역</button>
        <!--<button class="tab-btn" data-tab="watch">관심종목</button>-->
      </div>
      <div class="tab-content">
        <div id="holding" class="tab-pane active">
          <div class="empty-state">
            보유 종목이 없습니다.
          </div>
        </div>

        <div id="history" class="tab-pane">
          <div class="empty-state">
            거래 내역이 없습니다.
          </div>
        </div>

<!--        <div id="watch" class="tab-pane">
          <div class="empty-state">
            관심 종목을 추가하세요
          </div>
        </div>-->
      </div>
    </div>
  </div>

</div>


<script th:inline="none">
  const rankBody       = document.getElementById('rankBody');
  const statusDot      = document.getElementById('statusDot');
  const statusText     = document.getElementById('statusText');
  const lastUpdateChip = document.getElementById('lastUpdateChip');
  const lastUpdateText = document.getElementById('lastUpdateText');

  function fmtPrice(v) { return parseInt(v || 0).toLocaleString('ko-KR') + '원'; }
  function fmtVol(v) {
    const n = parseInt(v || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '억주';
    if (n >= 1e4) return Math.floor(n / 1e4).toLocaleString() + '만주';
    return n.toLocaleString() + '주';
  }

  function direction(rate) { const n = parseFloat(rate); return n > 0 ? 'up' : n < 0 ? 'down' : 'flat'; }

  function sign(rate) {
    const n = parseFloat(rate);
    return (n > 0 ? '▲' : n < 0 ? '▼' : '') + Math.abs(n).toFixed(2) + '%';
  }

  let maxVol = 1;

  function renderTable(list) {
    <!-- console.log('데이터:', list[0]); -->

    maxVol = Math.max(...list.map(d => parseInt(d.acmlVol || 0)), 1);
    rankBody.innerHTML = '';

    list.forEach((d, i) => {
      const rank     = parseInt(d.dataRank || i + 1);
      const dir      = direction(d.prdyCtrt);
      const volPct   = Math.round(parseInt(d.acmlVol || 0) / maxVol * 100);
      const badgeCls = rank <= 3 ? 'r' + rank : '';
      const vrss     = parseInt(d.prdyVrss || 0);

      const row = document.createElement('tr');
      row.style.animationDelay = (i * 20) + 'ms';
      row.innerHTML = `
        <td><span class="rank-badge ${badgeCls}">${rank}</span></td>
        <td>
          <div class="stock-name">${d.htsKorIsnm}</div>
          <div class="stock-code">${d.mkscShrnIscd}</div>
        </td>
        <td class="right"><div class="price">${fmtPrice(d.stckPrpr)}</div></td>
        <td class="right">
          <div class="change ${dir}">${sign(d.prdyCtrt)}</div>
          <div class="change-abs ${dir}">${vrss > 0 ? '+' : ''}${vrss.toLocaleString()}원</div>
        </td>
        <td class="right">
          <div class="vol-num">${fmtVol(d.acmlVol)}</div>
          <div class="vol-bar-bg"><div class="vol-bar-fill" style="width:${volPct}%"></div></div>
        </td>
        <td class="right col-pvol">
          <div class="vol-num">${fmtVol(d.prdyVol)}</div>
        </td>`;
      rankBody.appendChild(row);

      // row 클릭 시 상세화면 이동
      row.addEventListener('click', () => {
        window.location.href = `/stock/${d.mkscShrnIscd}?name=${encodeURIComponent(d.htsKorIsnm)}`;
      });
    });

    const wrap = document.querySelector('.table-wrap');
    wrap.classList.remove('flash');
    void wrap.offsetWidth;
    wrap.classList.add('flash');
  }

  function refreshSeed() {
    if (!window.__authenticated) return;
    fetch('/api/member/info')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
          if (!data) return;
          const seed = parseInt(data.seed);
          document.getElementById('seed').textContent = seed.toLocaleString('ko-KR');
      })
      .catch(() => {});
  }
  refreshSeed();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {

        document.querySelectorAll('.tab-btn')
            .forEach(b => b.classList.remove('active'));

        document.querySelectorAll('.tab-pane')
            .forEach(p => p.classList.remove('active'));

        btn.classList.add('active');

        document
            .getElementById(btn.dataset.tab)
            .classList.add('active');
    });
  });

  let rankLoaded = false;

  function hideLoadingOverlay() {
    rankLoaded = true;
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.add('hidden');
  }

  // 일정 시간이 지나도 데이터가 안 왔으면 무한 로딩 대신 에러 화면 + 다시 시도 버튼을 보여줌
  function showLoadingError() {
    if (rankLoaded) return;
    document.getElementById('loadingSpinner').style.display = 'none';
    document.getElementById('loadingText').textContent = '실시간 랭킹을 불러오지 못했습니다.';
    document.getElementById('loadingRetryBtn').style.display = 'inline-block';
  }
  setTimeout(showLoadingError, 10000);

  document.getElementById('loadingRetryBtn').addEventListener('click', () => location.reload());

  function connectSSE() {
    statusDot.className = 'dot loading';
    statusText.textContent = '연결 중...';

    const es = new EventSource('/api/volume/stream');

    es.addEventListener('volume-rank', (e) => {
      hideLoadingOverlay();
      const payload = JSON.parse(e.data);
      renderTable(payload.data);
      statusDot.className = 'dot live';
      statusText.textContent = '실시간 연결';
      lastUpdateChip.style.display = 'flex';
      lastUpdateText.textContent = new Date(payload.updatedAt).toLocaleTimeString('ko-KR');
    });

    // 탭 클릭 시 데이터 로드 (보유주식은 SSE로 항상 최신 상태 유지되므로 다시 불러올 필요 없음)
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');

            if (btn.dataset.tab === 'history') loadHistory();
        });
    });

    // 매번 통째로 다시 그리지 않고, 종목 구성이 바뀔 때만 테이블을 다시 만들고 그 외엔 바뀐 셀만 갱신
    let holdingRows = null; // Map<stockCode, {row, qtyTd, priceTd, rateTd, profitTd, last:{}}>

    function buildHoldingTable() {
        const el = document.getElementById('holding');
        el.innerHTML = `
            <table class="order-table">
                <thead>
                    <tr>
                        <th>종목명</th>
                        <th class="right">수량</th>
                        <th class="right">현재가</th>
                        <th class="right">수익률</th>
                        <th class="right">평가손익</th>
                    </tr>
                </thead>
                <tbody id="holdingBody"></tbody>
            </table>`;
        holdingRows = new Map();
    }

    function createHoldingRow(tbody, stockCode, stockName) {
        const row = document.createElement('tr');
        row.className = 'clickable-row';
        row.dataset.code = stockCode;
        row.dataset.name = encodeURIComponent(stockName);
        row.addEventListener('click', () => {
            window.location.href = `/stock/${row.dataset.code}?name=${row.dataset.name}`;
        });

        const nameTd = document.createElement('td');
        nameTd.innerHTML = `<div class="stock-name">${stockName}</div>`;

        const qtyTd    = document.createElement('td'); qtyTd.className    = 'right';
        const priceTd  = document.createElement('td'); priceTd.className  = 'right';
        const rateTd   = document.createElement('td'); rateTd.className   = 'right';
        const profitTd = document.createElement('td'); profitTd.className = 'right';

        row.append(nameTd, qtyTd, priceTd, rateTd, profitTd);
        tbody.appendChild(row);

        return { row, qtyTd, priceTd, rateTd, profitTd, last: {} };
    }

    function renderHolding(list) {
        if (!list || list.length === 0) {
            document.getElementById('holding').innerHTML = '<div class="empty-state">보유 종목이 없습니다.</div>';
            holdingRows = null;
            return;
        }

        // 보유 종목 구성 자체가 바뀐 경우(신규 매수/전량 매도)에만 테이블을 새로 만듦
        const codes = list.map(o => o.stockCode);
        const sameCodes = holdingRows && codes.length === holdingRows.size && codes.every(c => holdingRows.has(c));

        if (!sameCodes) {
            buildHoldingTable();
            const tbody = document.getElementById('holdingBody');
            list.forEach(o => holdingRows.set(o.stockCode, createHoldingRow(tbody, o.stockCode, o.stockName)));
        }

        list.forEach(o => {
            const cell = holdingRows.get(o.stockCode);
            if (!cell) return;

            if (cell.last.totalQuantity !== o.totalQuantity) {
                cell.qtyTd.textContent = `${o.totalQuantity}주`;
                cell.last.totalQuantity = o.totalQuantity;
            }

            if (cell.last.totalValue !== o.totalValue) {
                cell.priceTd.textContent = `${o.totalValue.toLocaleString()}원`;
                cell.last.totalValue = o.totalValue;
            }

            const dir = o.profitRate > 0 ? 'up' : o.profitRate < 0 ? 'down' : 'flat';
            const sign = o.profitRate > 0 ? '▲' : o.profitRate < 0 ? '▼' : '';
            const rateText = `${sign}${Math.abs(o.profitRate).toFixed(2)}%`;
            if (cell.last.rateText !== rateText) {
                cell.rateTd.textContent = rateText;
                cell.rateTd.className = `right ${dir}`;
                cell.last.rateText = rateText;
            }

            const profitText = `${o.profitValue > 0 ? '+' : ''}${o.profitValue.toLocaleString()}원`;
            if (cell.last.profitText !== profitText) {
                cell.profitTd.textContent = profitText;
                cell.profitTd.className = `right ${dir}`;
                cell.last.profitText = profitText;
            }
        });
    }

    let holdingConnected = false;

    function connectHoldingSSE() {
        if (holdingConnected) return;

        if (!window.__authenticated) {
            document.getElementById('holding').innerHTML = '<div class="empty-state">로그인이 필요합니다.</div>';
            return;
        }

        holdingConnected = true;
        const holdingEs = new EventSource('/api/order/holding/stream');

        holdingEs.addEventListener('holding', (e) => {
            renderHolding(JSON.parse(e.data));
        });

        holdingEs.onerror = () => {
            holdingEs.close();
            holdingConnected = false;
            setTimeout(connectHoldingSSE, 5000);
        };
    }

    function loadHistory() {
        fetch('/api/order/history')
            .then(r => {
              if(r.url.includes('/login')) {
                document.getElementById('history').innerHTML = '<div class="empty-state">로그인이 필요합니다.</div>';
                return;
              }
              return r.json();
            })
            .then(list => {
                if(!list) return;
                const el = document.getElementById('history');
                if (!list || list.length === 0) {
                    el.innerHTML = '<div class="empty-state">거래 내역이 없습니다.</div>';
                    return;
                }
                el.innerHTML = `
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>종목명</th>
                                <th class="right">구분</th>
                                <th class="right">수량</th>
                                <th class="right">단가</th>
                                <th class="right">상태</th>
                                <th class="right">주문시간</th>
                                <th class="right"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${list.map(o => `
                            <tr>
                                <td>
                                    <div class="stock-name">${o.stockName}</div>
                                    <div class="stock-code">${o.stockCode}</div>
                                </td>
                                <td class="right">
                                    <span class="badge ${o.orderType === 'BUY' ? 'buy' : 'sell'}">
                                        ${o.orderType === 'BUY' ? '매수' : '매도'}
                                    </span>
                                </td>
                                <td class="right">${o.quantity}주</td>
                                <td class="right">${o.price.toLocaleString()}원</td>
                                <td class="right">
                                    <span class="status ${o.orderStatus.toLowerCase()}">
                                        ${statusLabel(o.orderStatus)}
                                    </span>
                                </td>
                                <td class="right">${fmtDateTime(o.createdAt)}</td>
                                <td class="right">
                                    ${(o.orderStatus === 'PENDING' || o.orderStatus === 'PARTIAL')
                                        ? `<button class="cancel-order-btn" data-order-id="${o.orderId}">취소</button>`
                                        : ''}
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>`;

                el.querySelectorAll('.cancel-order-btn').forEach(btn => {
                    btn.addEventListener('click', () => cancelOrder(btn.dataset.orderId, () => {
                        loadHistory();
                        refreshSeed();
                    }));
                });

            })
            .catch(() => {
                document.getElementById('history').innerHTML = '<div class="empty-state">오류가 발생했습니다.</div>';
            });



    }

    function statusLabel(status) {
        const map = {
            'PENDING': '대기',
            'MATCHED': '체결',
            'PARTIAL': '부분체결',
            'CANCELLED': '취소',
            'FAILED': '실패'
        };
        return map[status] || status;
    }

    function cancelOrder(orderId, onDone) {
        if (!confirm('이 주문을 취소하시겠습니까?')) return;

        fetch(`/api/order/${orderId}/cancel`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.message === 'SUCCESS') {
                    if (onDone) onDone();
                } else {
                    alert(data.message || '취소에 실패했습니다.');
                }
            })
            .catch(() => alert('취소 처리 중 오류가 발생했습니다.'));
    }

    function fmtDateTime(str) {
        if (!str) return '-';
        const d = new Date(str);
        return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
    }

    // 페이지 로드 시 보유주식 실시간 스트림 연결
    connectHoldingSSE();

    es.onerror = () => {
      statusDot.className = 'dot error';
      statusText.textContent = '연결 끊김 · 재연결 중...';
      es.close();
      setTimeout(connectSSE, 5000);
    };
  }

  connectSSE();
</script>
<script src="/js/alarm.js"></script>
</body>
</html>
