<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${code} + ' 상세'">주식 상세</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/stockDetail.css"/>

</head>
<body>

<div id="stockData1" th:data-code="${code}"></div>
<div id="stockData2" th:data-name="${name}"></div>
<input id="stockData3" style="display:none;">

<!-- 실시간 현재가가 도착하기 전까지 표시 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner" id="loadingSpinner"></div>
    <div class="loading-text" id="loadingText">실시간 시세를 불러오는 중...</div>
    <button type="button" class="retry-btn" id="loadingRetryBtn" style="display:none;">다시 시도</button>
</div>

<div class="page">

    <!-- 헤더 -->
    <!-- 헤더 -->
    <header class="header">
        <div th:replace="~{fragments/header :: header}"></div>
    </header>

    <div class="page-width">
        <!-- 종목 요약 -->
        <div class="stock-summary" id="stockSummary">
            <div class="stock-identity">
                <div class="stock-icon" id="stockIcon">—</div>
                <div class="stock-name-block">
                    <div class="name" id="stockName" th:text="${name}">로딩 중...</div>
                    <div class="code-tag" id="stockCode" th:text="${code}"></div>
                </div>
            </div>
            <div class="stock-price-block">
                <div class="current-price" id="currentPrice">—</div>
                <div class="price-change flat" id="priceChange">—</div>
            </div>
        </div>

        <div class="seed-info"  sec:authorize="isAnonymous()" >
            가입 시 초기 투자금&nbsp;&nbsp;<span>10,000,000원</span>이 지급됩니다.
        </div>
        <!-- 매수/매도 -->
        <div class="trade-header" sec:authorize="isAuthenticated()">
            <button class="buy-btn" onclick="openModal('buy')">매수</button>
            <button class="sell-btn" onclick="openModal('sell')">매도</button>
        </div>

        <!-- 모달 -->
        <div id="tradeModal" class="modal">
            <div class="modal-content">

                <div class="modal-top">
                    <h2 id="modalTitle">-</h2>
                    <span class="close-btn" onclick="closeModal()">✕</span>
                </div>

                <div class="stock-info">
                    <div class="stock-name" th:text="${name}">-</div>
                    <div class="stock-price" id="stockPrice">-</div>
                </div>

                <div class="max-qty-info" id="maxQtyInfo"></div>

                <div class="input-group">
                    <label>주문 수량</label>
                    <input id="quantity" type="number" placeholder="수량 입력">
                </div>

                <!-- 매수 전용: 기존 방식 그대로(현재가로 총액 자동 계산) -->
                <div class="input-group" id="buyPriceGroup">
                    <label>주문 가격</label>
                    <input id="orderPrice" type="number" placeholder="가격 입력">
                </div>

                <!-- 매도 전용: 현재가/지정가 선택 + 단가/최종금액/수익 -->
                <div id="sellPriceSection" style="display:none;">
                    <div class="price-mode-tabs">
                        <button type="button" class="price-mode-btn active" id="marketPriceBtn" data-mode="market">현재가</button>
                        <button type="button" class="price-mode-btn" id="limitPriceBtn" data-mode="limit">지정가</button>
                    </div>

                    <div class="input-group">
                        <label>판매 단가 (1주)</label>
                        <input id="sellUnitPrice" type="number" readonly>
                    </div>

                    <div class="readonly-info-group">
                        <div class="readonly-info-row">
                            <span>최종 판매 금액</span>
                            <span id="sellTotalAmount">0원</span>
                        </div>
                        <div class="readonly-info-row">
                            <span>판매 수익</span>
                            <span id="sellProfit">0원</span>
                        </div>
                    </div>
                </div>

                <button class="submit-btn" id="submit-btn">주문하기</button>

            </div>
        </div>

        <!-- 상세 지표 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">등락률</div>
                <div class="stat-value" id="statRate"><div class="skeleton" style="width:60px"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">누적 거래량</div>
                <div class="stat-value" id="statVol"><div class="skeleton" style="width:80px"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">전일 대비</div>
                <div class="stat-value" id="statVrss"><div class="skeleton" style="width:70px"></div></div>
            </div>
        </div>

        <!-- 실시간 호가 -->
        <div class="section-title">호가</div>
        <div class="orderbook" id="orderbook"></div>

        <!-- 관련 뉴스 -->
        <div class="section-title">관련 뉴스</div>
        <div class="news-list" id="newsList">
            <!-- 뉴스 스켈레톤 -->
            <div th:each="i : ${#numbers.sequence(1,4)}" class="news-skeleton">
                <div class="skeleton" style="width:80%;margin-bottom:8px"></div>
                <div class="skeleton" style="width:40%;height:10px;margin-bottom:6px"></div>
                <div class="skeleton" style="width:100%;height:10px"></div>
            </div>
        </div>

    </div>
</div>

<script th:inline="none">
    const code     = document.getElementById('stockData1').dataset.code;
    const name     = document.getElementById('stockData2').dataset.name;
    const stockIcon = document.getElementById('stockIcon');

    <!--              html             -->
    function fmtPrice(v) { return parseInt(v || 0).toLocaleString('ko-KR') + '원'; }
    function fmtVol(v) {
      const n = parseInt(v || 0);
      if (n >= 1e8) return (n / 1e8).toFixed(1) + '억주';
      if (n >= 1e4) return Math.floor(n / 1e4).toLocaleString() + '만주';
      return n.toLocaleString() + '주';
    }
    function fmtDate(str) {
      // "Mon, 08 May 2026 10:00:00 +0900" 형식 파싱
      const d = new Date(str);
      return isNaN(d) ? str : d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function stripHtml(str) {
      return str.replace(/<[^>]*>/g, '');
    }

    <!--              로딩 오버레이              -->
    let priceLoaded = false;

    function hideLoadingOverlay() {
        priceLoaded = true;
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.classList.add('hidden');
    }

    // 일정 시간이 지나도 데이터가 안 왔으면 무한 로딩 대신 에러 화면 + 다시 시도 버튼을 보여줌
    function showLoadingError() {
        if (priceLoaded) return;
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('loadingText').textContent = '실시간 시세를 불러오지 못했습니다.';
        document.getElementById('loadingRetryBtn').style.display = 'inline-block';
    }
    setTimeout(showLoadingError, 10000);

    document.getElementById('loadingRetryBtn').addEventListener('click', () => location.reload());

    <!--              주식 상세 조회              -->
    function connectSSE() {
        const es = new EventSource(`/api/stock/${code}/stream`);
        es.addEventListener('stock-detail', (e) => {
            hideLoadingOverlay();
            const data = JSON.parse(e.data);

            const rate  = parseFloat(data.prdyCtrt || 0);
            const vrss  = parseInt(data.prdyVrss || 0);
            const dir   = rate > 0 ? 'up' : rate < 0 ? 'down' : 'flat';
            const sign  = rate > 0 ? '▲' : rate < 0 ? '▼' : '';

            <!-- 종목 아이콘 (앞 2글자) -->
            stockIcon.textContent = code.slice(0, 2);

            const priceEl = document.getElementById('currentPrice');
            priceEl.textContent = fmtPrice(data.stckPrpr);
            document.getElementById('stockData3').value = data.stckPrpr;

            // 매도 모달이 "현재가" 모드로 열려있는 동안엔 실시간 체결가를 계속 반영
            modalStockPrice = parseInt(data.stckPrpr) || 0;
            if (orderType === 'sell' && priceMode === 'market'
                    && document.getElementById('tradeModal').style.display === 'block') {
                sellUnitPrice.value = modalStockPrice;
                updateSellComputedFields();
            }

            const changeEl = document.getElementById('priceChange');
            changeEl.className = `price-change ${dir}`;
            changeEl.textContent = `${sign} ${Math.abs(rate).toFixed(2)}%  ${vrss > 0 ? '+' : ''}${vrss.toLocaleString()}원`;

            document.getElementById('statRate').textContent  = `${sign}${Math.abs(rate).toFixed(2)}%`;
            document.getElementById('statRate').className    = `stat-value ${dir === 'up' ? 'price-change up' : dir === 'down' ? 'price-change down' : ''}`;
            document.getElementById('statVol').textContent   = fmtVol(data.acmlVol);
            document.getElementById('statVrss').textContent  = `${vrss > 0 ? '+' : ''}${vrss.toLocaleString()}원`;
        });
    }

    <!--              실시간 호가 조회 - 매번 새로 그리지 않고 바뀐 셀만 갱신              -->
    function fmtNum(v) { return parseInt(v || 0).toLocaleString('ko-KR'); }

    let orderbookCells = null; // { ask: {1:{row,bar,price,vol}, ...10}, bid: {...} }

    function createOrderbookRow(container, side) {
        const row = document.createElement('div');
        row.className = `orderbook-row ${side}`;

        const bar = document.createElement('div');
        bar.className = 'orderbook-bar';

        const left = document.createElement('span');
        left.className = 'orderbook-left';

        const arrow = document.createElement('span');
        arrow.className = 'orderbook-arrow';

        const price = document.createElement('span');
        price.className = 'orderbook-price';

        const vol = document.createElement('span');
        vol.className = 'orderbook-vol';

        left.append(arrow, price);
        row.append(bar, left, vol);
        container.appendChild(row);

        return { row, bar, arrow, price, vol, lastPrice: null, lastVol: null };
    }

    function buildOrderbookSkeleton() {
        const container = document.getElementById('orderbook');
        container.innerHTML = '';
        orderbookCells = { ask: {}, bid: {} };

        // 매도호가: 10단계(가장 먼 가격)부터 1단계(현재가에 가장 가까운 가격) 순으로 위에서 아래로 배치
        for (let lvl = 10; lvl >= 1; lvl--) orderbookCells.ask[lvl] = createOrderbookRow(container, 'ask');
        for (let lvl = 1; lvl <= 10; lvl++) orderbookCells.bid[lvl] = createOrderbookRow(container, 'bid');
    }

    function updateOrderbookCell(cell, price, vol, maxVol) {
        const priceNum = parseInt(price || 0);
        const volNum   = parseInt(vol || 0);

        // 실제로 바뀐 값만 DOM에 쓴다 - 안 바뀐 셀은 건드리지 않아야 전체가 같이 깜빡이지 않음
        if (cell.lastVol !== volNum) {
            cell.bar.style.width = Math.round(volNum / maxVol * 100) + '%';
            cell.vol.textContent = volNum.toLocaleString();
            cell.lastVol = volNum;
        }

        if (cell.lastPrice !== priceNum) {
            if (cell.lastPrice !== null) {
                const up = priceNum > cell.lastPrice;
                cell.arrow.textContent = up ? '▲' : '▼';
                cell.arrow.className = `orderbook-arrow ${up ? 'up' : 'down'}`;
            }
            cell.price.textContent = fmtNum(price);
            cell.lastPrice = priceNum;
        }
    }

    function renderOrderbook(data) {
        if (!orderbookCells) buildOrderbookSkeleton();

        const askVols = data.askVolumes.map(v => parseInt(v || 0));
        const bidVols = data.bidVolumes.map(v => parseInt(v || 0));
        const maxVol  = Math.max(...askVols, ...bidVols, 1);

        for (let i = 0; i < 10; i++) {
            const lvl = i + 1;
            updateOrderbookCell(orderbookCells.ask[lvl], data.askPrices[i], data.askVolumes[i], maxVol);
            updateOrderbookCell(orderbookCells.bid[lvl], data.bidPrices[i], data.bidVolumes[i], maxVol);
        }
    }

    function connectAskingPriceSSE() {
        const es = new EventSource(`/api/stock/${code}/asking/stream`);
        es.addEventListener('asking-price', (e) => {
            renderOrderbook(JSON.parse(e.data));
        });
    }

    <!--              뉴스 조회              -->
    fetch(`/api/news/${name}`)
      .then(r => r.json())
      .then(items => {
        const newsList = document.getElementById('newsList');
        if (!items || items.length === 0) {
          newsList.innerHTML = '<div class="news-error">관련 뉴스가 없습니다.</div>';
          return;
        }
        newsList.innerHTML = '';
        items.forEach((item, i) => {
          const card = document.createElement('a');
          card.className = 'news-card';
          card.href = item.link;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.style.animationDelay = (i * 60) + 'ms';
          card.innerHTML = `
            <div class="news-title">${item.title}</div>
            <div class="news-meta">
              <span>${fmtDate(item.pubDate)}</span>
            </div>
            <div class="news-desc">${stripHtml(item.description)}</div>
          `;
          newsList.appendChild(card);
        });
      }).catch(() => {
        alert("catch");
        document.getElementById('newsList').innerHTML =
          '<div class="news-error">뉴스를 불러오지 못했습니다.</div>';
      });



    <!--              모달창              -->
    let modalStockPrice = 0;
    let orderType = '';
    let seed = 0;
    let maxQty = 0;
    let sellAvgPrice = 0;
    let priceMode = 'market'; // 'market' | 'limit' - 매도 전용

    function openModal(type) {
        orderType = type;

        const modal = document.getElementById('tradeModal');
        const title = document.getElementById('modalTitle');
        const submitBtn = document.querySelector('.submit-btn');
        const price = document.getElementById('stockPrice');
        const buyPriceGroup = document.getElementById('buyPriceGroup');
        const sellPriceSection = document.getElementById('sellPriceSection');

        const clickPrice = parseInt(document.getElementById('stockData3').value || 0);
        modalStockPrice = clickPrice;

        price.innerText = document.getElementById('currentPrice').textContent;
        quantity.value = '';

        if(type == 'buy') {
            title.innerText = '매수 주문';
            submitBtn.innerText = '매수하기';
            submitBtn.style.background = 'linear-gradient(135deg, #ff3b5c, #ff6b81)';

            buyPriceGroup.style.display = 'flex';
            sellPriceSection.style.display = 'none';
            orderPrice.value = '';

            // 매수 가능 수량 계산
            fetch('/api/member/info')
            .then(r => r.json())
            .then(data => {
                seed = parseInt(data.seed);
                const maxBuyQty = modalStockPrice > 0 ? Math.floor(seed / modalStockPrice) : 0;
                document.getElementById('maxQtyInfo').textContent =
                    `보유 투자금: ${seed.toLocaleString()}원 / 최대 ${maxBuyQty}주 매수 가능`;
            });

        } else if (type == 'sell') {
            title.innerText = '매도 주문';
            submitBtn.innerText = '매도하기';
            submitBtn.style.background = 'linear-gradient(135deg, #2979ff, #5393ff)';

            buyPriceGroup.style.display = 'none';
            sellPriceSection.style.display = 'block';
            setPriceMode('market');

            // 매도 가능 수량 + 평균매입단가 조회
            fetch(`/api/order/memberStockInfo?stockCode=${code}`)
            .then(r => r.json())
            .then(data => {
                maxQty = data.totalQuantity;
                sellAvgPrice = parseFloat(data.avgPrice) || 0;
                document.getElementById('maxQtyInfo').textContent = `최대 ${maxQty}주 매도 가능`;
                updateSellComputedFields();
            });
        }

        modal.style.display = 'block';
    }

    function closeModal() {
        document.getElementById('quantity').value = 0;
        document.getElementById('orderPrice').value = 0;
        document.getElementById('sellUnitPrice').value = '';
        document.getElementById('tradeModal').style.display = 'none';
    }

    const quantity = document.getElementById('quantity');
    const orderPrice = document.getElementById('orderPrice');
    const sellUnitPrice = document.getElementById('sellUnitPrice');

    function setPriceMode(mode) {
        priceMode = mode;
        document.getElementById('marketPriceBtn').classList.toggle('active', mode === 'market');
        document.getElementById('limitPriceBtn').classList.toggle('active', mode === 'limit');

        if (mode === 'market') {
            sellUnitPrice.readOnly = true;
            sellUnitPrice.value = modalStockPrice;
        } else {
            sellUnitPrice.readOnly = false;
            if (!sellUnitPrice.value) sellUnitPrice.value = modalStockPrice;
        }
        updateSellComputedFields();
    }

    document.getElementById('marketPriceBtn').addEventListener('click', () => setPriceMode('market'));
    document.getElementById('limitPriceBtn').addEventListener('click', () => setPriceMode('limit'));

    // 최종 판매 금액 / 판매 수익 - 수정 불가, 수량·단가 바뀔 때마다 자동 계산
    function updateSellComputedFields() {
        const qty = parseInt(quantity.value) || 0;
        const unitPrice = parseInt(sellUnitPrice.value) || 0;
        const total = qty * unitPrice;
        const profit = Math.round((unitPrice - sellAvgPrice) * qty);

        document.getElementById('sellTotalAmount').textContent = total.toLocaleString() + '원';

        const profitEl = document.getElementById('sellProfit');
        const dir = profit > 0 ? 'up' : profit < 0 ? 'down' : '';
        profitEl.textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString() + '원';
        profitEl.className = dir;
    }

    sellUnitPrice.addEventListener('input', updateSellComputedFields);

    quantity.addEventListener('input', function() {

    if (parseInt(quantity.value) < 1 || quantity.value === '0') {

        quantity.value = 1;
        if (orderType === 'buy') orderPrice.value = modalStockPrice;

        alert('1주 이상 주문 가능합니다.');

    } else if (orderType === 'buy') {
        orderPrice.value = parseInt(quantity.value) * modalStockPrice;
    }

    if (orderType === 'sell') updateSellComputedFields();
});

    const submitBtn = document.getElementById("submit-btn");
    submitBtn.addEventListener('click', () => {
        const submitPrice = orderType === 'sell' ? (parseInt(sellUnitPrice.value) || 0) : modalStockPrice;
        const submitTotal = orderType === 'sell'
            ? (parseInt(quantity.value) || 0) * submitPrice
            : (parseInt(orderPrice.value) || 0);

        if(orderType == 'buy' && seed < submitTotal) {
            alert('보유 금액이 부족합니다.');
            return;
        }

        if(orderType == 'sell' && parseInt(document.getElementById('quantity').value) > parseInt(maxQty)) {
            alert('보유 주식 보다 매도 주식 수가 큽니다.');
            return;
        }

        if (parseInt(quantity.value) < 1 || quantity.value === '0') {
            alert('수량을 입력하세요.');
            return;
        }

        if (orderType === 'sell' && submitPrice <= 0) {
            alert('판매 단가를 입력하세요.');
            return;
        }

        const action = orderType == 'buy' ? '매수' : '매도';
        const confirmed = confirm(
            `${action} 주문을 확정하시겠습니까?\n\n` +
            `종목: ${name}\n` +
            `수량: ${quantity.value}주\n` +
            `단가: ${submitPrice.toLocaleString()}원\n` +
            `총액: ${submitTotal.toLocaleString()}원`
        );

        if (!confirmed) return;

        fetch('/api/order/create', {
            method: 'POST',
            credentials: 'include',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                stockCode: code,
                stockName: name,
                orderType: orderType == 'buy' ? 'BUY' : 'SELL',
                quantity: quantity.value,
                price : submitPrice /* 단가 */
            })
        }).then(r => r.json())
        .then(data => {
            if (!data.orderId) {
                alert(data.message || '주문이 거부되었습니다.');
                return;
            }
            alert('주문완료 : 주문번호 :' + data.orderId);
            closeModal();
        }).catch(() => {
            alert('주문 처리 중 오류가 발생했습니다.');
        });
    });

    connectSSE();
    connectAskingPriceSSE();
</script>
<script src="/js/alarm.js"></script>
</body>
</html>
