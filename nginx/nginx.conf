# 앱 서버 3대 앞의 로드밸런서 - 라운드로빈(기본값).
# sticky session을 안 쓰는 이유: 로그인 세션은 MySQL(Spring Session JDBC), 체결 알림·관리자 알림은 Kafka 브로드캐스트라
# 어느 서버로 가도 같은 결과가 나온다. sticky면 서버가 죽을 때 그 서버에 묶인 사용자가 같이 끊기고 부하도 고르게 안 나뉨.
upstream stocktrade_app {
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://stocktrade_app;

        # SSE(시세·체결 알림 스트림): nginx가 응답을 모아뒀다 보내면 실시간이 아니게 되므로 버퍼링을 끄고,
        # 이벤트가 한동안 없어도 연결이 끊기지 않게 읽기 타임아웃을 길게
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # 앱이 원래 주소(localhost:8088)를 알도록 - 로그인 리다이렉트·카카오 OAuth redirect-uri 생성에 사용
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 포트까지 포함한 원래 Host - X-Forwarded-Proto만 있고 이게 없으면 스프링이 포트를 기본값(80)으로 보고 리다이렉트에서 :8088을 빼먹음
        proxy_set_header X-Forwarded-Host $http_host;

        # 어느 서버가 응답했는지 확인용(라운드로빈 검증)
        add_header X-Upstream $upstream_addr always;
    }
}
