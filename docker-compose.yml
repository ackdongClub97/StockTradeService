# 로컬 인프라. 관측(Loki/Grafana/Prometheus)은 observability/docker-compose.yml에 따로 있음.
# 계정/비밀번호는 로컬 전용 기본값 - 운영에서 쓰지 말 것.
#
# - 서버 1대 개발: docker compose up -d mysql  (Kafka는 로컬 설치본 localhost:9092 사용, 앱은 ./gradlew bootRun)
# - 서버 여러 대:  ./gradlew bootJar && docker compose --profile cluster up -d --build
#     nginx(localhost:8088) -> app1(시세 수집기) / app2 / app3 라운드로빈, 전용 Kafka(호스트에서 localhost:9095)
#     호스트 포트를 8088/9095/3307로 둔 이유: 8080(로컬 bootRun), 9092(로컬 Kafka), 3306(로컬 MySQL)과 안 겹치게
services:
  mysql:
    image: mysql:8.4
    container_name: stocktrade-mysql
    ports:
      - "3307:3306" # 3306은 로컬에 직접 설치된 MySQL이 쓰고 있어서 3307로 노출
    environment:
      MYSQL_DATABASE: stocktrade
      MYSQL_USER: stocktrade
      MYSQL_PASSWORD: stocktrade
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ustocktrade", "-pstocktrade", "--silent"]
      interval: 5s
      retries: 20

  kafka:
    profiles: ["cluster"]
    image: apache/kafka:3.8.0
    container_name: stocktrade-kafka
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  app1:
    profiles: ["cluster"]
    build: .
    image: stocktrade-app
    container_name: stocktrade-app1
    environment: &app-env
      MARKET_DATA_COLLECTOR: "true" # KIS와 직접 통신하는 시세 수집기는 이 서버 한 대
      MYSQL_URL: jdbc:mysql://mysql:3306/stocktrade
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # JAR 안의 정적 리소스/템플릿을 쓰도록(기본 설정은 개발용 file:src/main/resources/ 경로)
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: classpath:/static/
      SPRING_THYMELEAF_PREFIX: classpath:/templates/
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes: &app-volumes
      - ./application-secret.yaml:/app/application-secret.yaml:ro
    depends_on: &app-deps
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  app2:
    profiles: ["cluster"]
    image: stocktrade-app
    container_name: stocktrade-app2
    environment:
      <<: *app-env
      MARKET_DATA_COLLECTOR: "false"
    volumes: *app-volumes
    depends_on: *app-deps

  app3:
    profiles: ["cluster"]
    image: stocktrade-app
    container_name: stocktrade-app3
    environment:
      <<: *app-env
      MARKET_DATA_COLLECTOR: "false"
    volumes: *app-volumes
    depends_on: *app-deps

  nginx:
    profiles: ["cluster"]
    image: nginx:1.27-alpine
    container_name: stocktrade-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  mysql-data:
