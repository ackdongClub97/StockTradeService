  <text x="125" y="531" text-anchor="middle" font-size="10" fill="#555">체결가 · 호가 · 랭킹</text>

  <rect x="220" y="482" width="150" height="56" fill="#ffffff" rx="6" stroke="#9fa8da" stroke-width="1.2"/>
