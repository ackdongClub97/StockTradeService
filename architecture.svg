  <polygon points="220,264 226,255 231,262" fill="#ce93d8"/>
  <line x1="540" y1="250" x2="470" y2="264" stroke="#ce93d8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="470,264 473,254 481,259" fill="#ce93d8"/>
  <line x1="580" y1="250" x2="700" y2="264" stroke="#ce93d8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="700,264 691,258 698,251" fill="#ce93d8"/>

  <!-- Row B -> Order State Machine -->
  <line x1="175" y1="320" x2="175" y2="358" stroke="#f48fb1" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="175,358 170,348 180,348" fill="#f48fb1"/>
  <line x1="715" y1="320" x2="715" y2="358" stroke="#f48fb1" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="715,358 710,348 720,348" fill="#f48fb1"/>

  <!-- Order State Machine -> External -->
  <line x1="125" y1="434" x2="125" y2="482" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="125,482 120,472 130,472" fill="#9fa8da"/>
  <line x1="295" y1="434" x2="295" y2="482" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="295,482 290,472 300,472" fill="#9fa8da"/>
  <line x1="465" y1="434" x2="465" y2="482" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="465,482 460,472 470,472" fill="#9fa8da"/>
  <line x1="635" y1="434" x2="635" y2="482" stroke="#ffca28" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="635,482 630,472 640,472" fill="#ffca28"/>
  <line x1="790" y1="434" x2="790" y2="482" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="790,482 785,472 795,472" fill="#9fa8da"/>

  <!-- External -> Observability -->
  <line x1="175" y1="554" x2="175" y2="602" stroke="#90a4ae" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="175,602 170,592 180,592" fill="#90a4ae"/>
  <line x1="445" y1="554" x2="445" y2="602" stroke="#90a4ae" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="445,602 440,592 450,592" fill="#90a4ae"/>
  <line x1="715" y1="554" x2="715" y2="602" stroke="#90a4ae" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="715,602 710,592 720,592" fill="#90a4ae"/>

  <!-- ─────────────────────────────────── -->
  <!-- Legend -->
  <!-- ─────────────────────────────────── -->
  <rect x="30" y="694" width="840" height="140" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1.2"/>
  <text x="50" y="714" font-size="11" font-weight="bold" fill="#333">Legend</text>

  <rect x="60" y="724" width="14" height="14" fill="#e8f4fd" stroke="#90caf9" stroke-width="1.2" rx="2"/>
  <text x="80" y="736" font-size="10" fill="#333">클라이언트</text>

  <rect x="190" y="724" width="14" height="14" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.2" rx="2"/>
