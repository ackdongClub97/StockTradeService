  <text x="715" y="651" text-anchor="middle" font-size="10" fill="#555">docker-compose 로컬 구동</text>

  <!-- ─────────────────────────────────── -->
  <!-- 연결 화살표 -->
  <!-- ─────────────────────────────────── -->

  <!-- Client -> Controller -->
  <line x1="215" y1="118" x2="300" y2="194" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>
