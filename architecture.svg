  <text x="450" y="808" font-size="10" fill="#555">• REST 폴링 대신 KIS 실시간 웹소켓으로 체결가·호가 수신</text>
  <text x="50" y="824" font-size="10" fill="#555">• Kafka 비동기 주문 처리 + Scheduled 30초 재시도</text>
  <text x="450" y="824" font-size="10" fill="#555">• FDS 이상거래탐지 + Loki/Grafana 관측 인프라</text>

</svg>
