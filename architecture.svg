<svg viewBox="0 0 900 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="860" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">📈 StockTradeService 시스템 아키텍처</text>

  <!-- ─────────────────────────────────── -->
  <!-- Layer 1: Client -->
  <!-- ─────────────────────────────────── -->
  <rect x="30" y="60" width="840" height="70" fill="#e8f4fd" rx="8" stroke="#90caf9" stroke-width="1.5"/>
  <text x="50" y="82" font-size="11" font-weight="bold" fill="#1565c0">CLIENT</text>

  <rect x="160" y="72" width="110" height="46" fill="#ffffff" rx="6" stroke="#90caf9" stroke-width="1.2"/>
  <text x="215" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">🌐 Browser</text>
  <text x="215" y="108" text-anchor="middle" font-size="10" fill="#555">Thymeleaf UI</text>

  <rect x="300" y="72" width="110" height="46" fill="#ffffff" rx="6" stroke="#90caf9" stroke-width="1.2"/>
  <text x="355" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">📱 Mobile</text>
  <text x="355" y="108" text-anchor="middle" font-size="10" fill="#555">반응형 지원</text>

  <text x="270" y="150" text-anchor="middle" font-size="9" fill="#1565c0">SSE 실시간 (랭킹·시세·호가·보유종목·체결결과)</text>
  <line x1="270" y1="155" x2="270" y2="162" stroke="#90caf9" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ─────────────────────────────────── -->
  <!-- Layer 2: Spring Boot App -->
  <!-- ─────────────────────────────────── -->
  <rect x="30" y="160" width="840" height="178" fill="#f3e5f5" rx="8" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="50" y="182" font-size="11" font-weight="bold" fill="#6a1b9a">SPRING BOOT APPLICATION (AWS EC2 · Ubuntu)</text>

  <!-- Row A -->
  <rect x="50" y="194" width="180" height="56" fill="#ffffff" rx="6" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="140" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">🔐 Security</text>
  <text x="140" y="230" text-anchor="middle" font-size="10" fill="#555">세션 로그인</text>
  <text x="140" y="243" text-anchor="middle" font-size="10" fill="#555">폼 로그인 + Kakao OAuth2</text>

  <rect x="250" y="194" width="180" height="56" fill="#ffffff" rx="6" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="340" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">🎮 Controller</text>
  <text x="340" y="230" text-anchor="middle" font-size="10" fill="#555">REST API</text>
  <text x="340" y="243" text-anchor="middle" font-size="10" fill="#555">SSE Endpoint</text>

  <rect x="450" y="194" width="180" height="56" fill="#ffffff" rx="6" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="540" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">⚙️ Service</text>
  <text x="540" y="230" text-anchor="middle" font-size="10" fill="#555">OrderService</text>
  <text x="540" y="243" text-anchor="middle" font-size="10" fill="#555">MatchingService</text>

  <rect x="650" y="194" width="180" height="56" fill="#ffffff" rx="6" stroke="#ce93d8" stroke-width="1.2"/>
  <text x="740" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">🛡️ FDS</text>
  <text x="740" y="230" text-anchor="middle" font-size="10" fill="#555">이상거래탐지</text>
  <text x="740" y="243" text-anchor="middle" font-size="10" fill="#555">차단 없이 관리자 알림</text>

