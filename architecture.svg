  <text x="175" y="300" text-anchor="middle" font-size="10" fill="#555">stock-order</text>
  <text x="175" y="313" text-anchor="middle" font-size="10" fill="#555">stock-order-result</text>

  <rect x="320" y="264" width="250" height="56" fill="#e0f7fa" rx="6" stroke="#26c6da" stroke-width="1.5"/>
  <text x="445" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#00838f">🔌 KIS 실시간 웹소켓 캐시</text>
  <text x="445" y="300" text-anchor="middle" font-size="10" fill="#555">H0STCNT0(체결가) · H0STASP0(호가)</text>
  <text x="445" y="313" text-anchor="middle" font-size="10" fill="#555">KisWebSocketService</text>

  <rect x="590" y="264" width="250" height="56" fill="#e8f5e9" rx="6" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="715" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">⏱ Scheduled 재시도</text>
  <text x="715" y="300" text-anchor="middle" font-size="10" fill="#555">30초 주기 (@Scheduled)</text>
  <text x="715" y="313" text-anchor="middle" font-size="10" fill="#555">PENDING / PARTIAL 재매칭</text>

  <!-- ─────────────────────────────────── -->
  <!-- Order State Machine -->
  <!-- ─────────────────────────────────── -->
  <rect x="30" y="358" width="840" height="76" fill="#fce4ec" rx="6" stroke="#f48fb1" stroke-width="1.2"/>
  <text x="447" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">📊 주문 상태 머신 (Order State Machine)</text>

  <rect x="70" y="384" width="90" height="36" fill="#ffffff" rx="5" stroke="#f48fb1" stroke-width="1"/>
  <text x="115" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">PENDING</text>

  <text x="185" y="407" text-anchor="middle" font-size="16" fill="#880e4f">→</text>

  <rect x="205" y="384" width="90" height="36" fill="#ffffff" rx="5" stroke="#f48fb1" stroke-width="1"/>
  <text x="250" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">MATCHED</text>

  <text x="318" y="407" text-anchor="middle" font-size="14" fill="#880e4f">/</text>

  <rect x="335" y="384" width="90" height="36" fill="#ffffff" rx="5" stroke="#f48fb1" stroke-width="1"/>
  <text x="380" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">PARTIAL</text>

  <text x="448" y="407" text-anchor="middle" font-size="14" fill="#880e4f">/</text>

  <rect x="465" y="384" width="100" height="36" fill="#ffffff" rx="5" stroke="#f48fb1" stroke-width="1"/>
  <text x="515" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">CANCELLED</text>

  <text x="588" y="407" text-anchor="middle" font-size="14" fill="#880e4f">/</text>

  <rect x="605" y="384" width="90" height="36" fill="#ffffff" rx="5" stroke="#f48fb1" stroke-width="1"/>
  <text x="650" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">FAILED</text>

  <text x="730" y="395" font-size="10" fill="#880e4f">PARTIAL →</text>
  <text x="730" y="410" font-size="10" fill="#880e4f">PENDING 재시도</text>
  <text x="730" y="425" font-size="10" fill="#880e4f">(Scheduled 처리)</text>

