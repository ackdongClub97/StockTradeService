  <text x="175" y="622" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">🛠 Admin 모니터링</text>
  <text x="175" y="638" text-anchor="middle" font-size="10" fill="#555">/admin/orders · 미체결 사유 조회</text>
  <text x="175" y="651" text-anchor="middle" font-size="10" fill="#555">FDS 알림 SSE 스트림</text>

  <rect x="320" y="602" width="250" height="56" fill="#ffffff" rx="6" stroke="#90a4ae" stroke-width="1.2"/>
  <text x="445" y="622" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">📉 Loki</text>
  <text x="445" y="638" text-anchor="middle" font-size="10" fill="#555">Logback 어펜더로 직접 전송</text>
  <text x="445" y="651" text-anchor="middle" font-size="10" fill="#555">LOKI_URL 미설정 시 비활성화</text>

