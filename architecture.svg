  <text x="635" y="518" text-anchor="middle" font-size="10" fill="#555">stock-order</text>
  <text x="635" y="531" text-anchor="middle" font-size="10" fill="#555">stock-order-result</text>

  <rect x="730" y="482" width="120" height="56" fill="#fff3e0" rx="6" stroke="#ffb74d" stroke-width="1.5"/>
